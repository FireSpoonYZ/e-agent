[package]
name = "e-agent-node-runtime"
version = "0.1.0"
edition = "2024"

[lib]
test = false

[dependencies]
base64 = "0.22"
crossbeam-queue = "0.3"
dirs = "6"
flate2 = "1.1.9"
getrandom = "0.4.1"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
regex = "1.12.3"
ring = "0.17.14"
rquickjs = { version = "0.11", features = ["futures", "loader"] }
scrypt = { version = "0.11.0", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
swc_common = "18.0.1"
swc_ecma_ast = "20.0.1"
swc_ecma_codegen = "23.0.0"
swc_ecma_parser = "34.0.0"
swc_ecma_transforms_base = "37.0.0"
swc_ecma_transforms_typescript = "41.0.0"
swc_ecma_visit = "20.0.0"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.21.0", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[features]
default = []
ext-conformance = []
runtime-tests = []
wasm-host = []

[dev-dependencies]
futures = "0.3"
proptest = "1.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
