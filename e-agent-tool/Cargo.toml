[package]
name = "e-agent-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dashmap = "6.2.1"
e-agent-macros = { path = "../e-agent-macros" }
pyo3 = { version = "0.29.2", features = ["abi3-py314", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
trybuild = "1"
