[package]
name = "e-agent-basic-tools"
version = "0.1.0"
edition = "2024"

[lib]
name = "basic_tools"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
e-agent-extension = { path = "../../e-agent-extension" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "sync", "time"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
