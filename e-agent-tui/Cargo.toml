[package]
name = "e-agent-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["event-stream"] }
e-agent-core = { path = "../e-agent-core" }
futures-util = "0.3"
pulldown-cmark = "0.13"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"] }
unicode-width = "0.2"
