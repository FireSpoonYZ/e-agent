[package]
name = "e-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.53", features = ["derive"] }
async-channel = "2.5.0"
async-openai = { version = "0.41.3", features = ["chat-completion", "responses"] }
async-trait = "0.1.92"
chrono = "0.4.45"
dotenvy = "0.15.7"
e-agent-extension = { path = "../e-agent-extension" }
e-agent-node-runtime = { path = "../e-agent-node-runtime" }
libloading = "0.9"
reqwest = { version = "0.13.4", features = ["blocking"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
