[package]
name = "e-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
async-openai = { version = "0.41.3", features = ["chat-completion", "responses"] }
async-trait = "0.1.92"
chrono = "0.4.45"
dotenvy = "0.15.7"
e-agent-tool = { path = "../e-agent-tool" }
pyo3 = { version = "0.29.2", features = ["abi3-py314", "generate-import-lib", "auto-initialize"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["attributes", "tokio-runtime"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
