[package]
name = "e-agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
dirs = "6"
e-agent-extension = { path = "../e-agent-extension" }
futures-core = "0.3"
futures-util = "0.3"
jsonschema = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.21.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["sync", "rt"] }
tokio-util = "0.7.18"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
