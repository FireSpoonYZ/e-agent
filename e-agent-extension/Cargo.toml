[package]
name = "e-agent-extension"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dashmap = "6.2.1"
e-agent-macros = { path = "../e-agent-macros" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
trybuild = "1"
